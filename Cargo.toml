[package]
name = "rt"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rt"
path = "src/main.rs"

[dependencies]
# Math
nalgebra = "0.35"

# Parallelism
rayon = "1.8"

# Random
rand = "0.10"

# GUI
egui = "0.35"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui_extras = { version = "0.36", features = ["image"] }

# Image output
image = "0.25"

# CLI args
clap = { version = "4", features = ["derive"] }

# Scene file (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nalgebra = "0.35"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1   # Keeps dev builds fast enough to actually run